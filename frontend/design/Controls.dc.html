<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modern-design-system-7e240850-8421-4e94-8aa0-19cdc16d01ba/colors_and_type.css">
<script src="_ds/modern-design-system-7e240850-8421-4e94-8aa0-19cdc16d01ba/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
</helmet>
<div style="height:112px; box-sizing:border-box; padding:0 40px; display:flex; align-items:center; gap:28px; border-top:1px solid var(--itg-line,#2A2E2B); background:var(--itg-bg,#0C0E0D); color:var(--itg-fg,#F4F2EE); font-family:'Geist',sans-serif; font-variant-numeric:tabular-nums;">
  <button onClick="{{ onToggle }}" aria-label="Play or pause" style="width:56px; height:56px; flex:none; border-radius:9999px; border:none; background:var(--itg-fg,#F4F2EE); color:var(--itg-bg,#0C0E0D); display:flex; align-items:center; justify-content:center; cursor:pointer;" style-active="transform:scale(.96)">
    <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
    </sc-if>
    <sc-if value="{{ paused }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z"></path></svg>
    </sc-if>
  </button>

  <div style="display:flex; align-items:center; gap:12px; flex:none;">
    <div style="display:flex; align-items:center; gap:4px; padding:4px; border-radius:10px; background:var(--itg-surface-2,#1F2320);">
      <div style="padding:0 8px 0 6px; color:var(--itg-fg-3,#8A867F); display:flex;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M10 2h4M12 14l3-3"></path><circle cx="12" cy="14" r="8"></circle></svg>
      </div>
      <button onClick="{{ set1 }}" style="height:40px; min-width:52px; border:none; border-radius:6px; background:{{ bg1 }}; color:{{ fg1 }}; font:800 22px 'Barlow Condensed',sans-serif; cursor:pointer;">1×</button>
      <button onClick="{{ set10 }}" style="height:40px; min-width:52px; border:none; border-radius:6px; background:{{ bg10 }}; color:{{ fg10 }}; font:800 22px 'Barlow Condensed',sans-serif; cursor:pointer;">10×</button>
    </div>
    <sc-if value="{{ keyMoment }}">
      <div style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--itg-fg-2,#B8B4AD);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a5 5 0 0 0 9.6 2H21V8H8.2A5 5 0 0 0 3 11Z"></path><path d="M15 8V5"></path></svg>
        <div>Auto-slowed for key moment</div>
      </div>
    </sc-if>
  </div>

  <div style="flex:1; min-width:0; position:relative; height:76px;">
    <sc-for list="{{ markers }}" as="m" hint-placeholder-count="4">
      <button onClick="{{ m.seek }}" title="{{ m.title }}" style="position:absolute; left:{{ m.left }}; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; background:transparent; border:none; padding:0; cursor:pointer; color:var(--itg-fg-2,#B8B4AD);" style-hover="color:var(--itg-fg,#F4F2EE)">
        <div style="height:18px; display:flex; align-items:center;">
          <sc-if value="{{ m.isGoal }}"><div style="width:16px; height:16px; border-radius:9999px; background:{{ m.color }}; border:2px solid var(--itg-fg,#F4F2EE); box-sizing:border-box;"></div></sc-if>
          <sc-if value="{{ m.isCard }}"><div style="width:11px; height:15px; border-radius:2px; background:#FFD21F;"></div></sc-if>
          <sc-if value="{{ m.isMomentum }}"><div style="width:12px; height:12px; transform:rotate(45deg); border:2px solid var(--itg-bad,#FF5A4F); box-sizing:border-box;"></div></sc-if>
        </div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px;">{{ m.label }}</div>
      </button>
    </sc-for>
    <div style="position:absolute; left:0; right:0; top:44px; height:6px; border-radius:9999px; background:var(--itg-surface-2,#1F2320);">
      <div style="position:absolute; left:0; top:0; bottom:0; width:{{ progress }}; border-radius:9999px; background:var(--itg-fg,#F4F2EE);"></div>
      <div style="position:absolute; left:50%; top:-4px; width:2px; height:14px; background:var(--itg-fg-3,#8A867F);"></div>
      <div style="position:absolute; left:{{ progress }}; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); border-radius:9999px; background:var(--itg-fg,#F4F2EE); box-shadow:0 0 0 4px var(--itg-bg,#0C0E0D);"></div>
    </div>
    <div style="position:absolute; left:0; right:0; top:58px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--itg-fg-3,#8A867F);">
      <div style="position:absolute; left:0;">0'</div>
      <div style="position:absolute; left:16.67%; transform:translateX(-50%);">15'</div>
      <div style="position:absolute; left:33.33%; transform:translateX(-50%);">30'</div>
      <div style="position:absolute; left:50%; transform:translateX(-50%);">HT</div>
      <div style="position:absolute; left:66.67%; transform:translateX(-50%);">60'</div>
      <div style="position:absolute; left:83.33%; transform:translateX(-50%);">75'</div>
      <div style="position:absolute; right:0;">90'</div>
    </div>
  </div>

  <div style="display:flex; align-items:baseline; gap:6px; flex:none; font-family:'Barlow Condensed',sans-serif; font-weight:800;">
    <div style="font-size:40px; line-height:1;">{{ minuteLabel }}</div>
    <div style="font-size:20px; color:var(--itg-fg-3,#8A867F);">/ 90'</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:112},&quot;minute&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:57,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1,10],&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;playing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;replay&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;keyMoment&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;minuteLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSpeed&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:number) =&gt; void&quot;},&quot;onSeek&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(m:number) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const minute = p.minute ?? 57;
    const speed = p.speed ?? 10;
    const replay = p.mode === 'replay';
    const all = [
      { m: 23, kind: 'goal', team: 'kba', title: 'Goal Kingsbridge' },
      { m: 38, kind: 'goal', team: 'ngr', title: 'Goal Northgate' },
      { m: 52, kind: 'card', title: 'Yellow card Quiroga' },
      { m: 67, kind: 'goal', team: 'kba', title: 'Goal Kingsbridge' },
      { m: 84, kind: 'goal', team: 'ngr', title: 'Goal Northgate' },
      { m: 86, kind: 'momentum', title: 'Claim overturned' },
    ];
    const markers = all.filter(x => replay || x.m <= minute).map(x => ({
      ...x, left: (x.m / 90 * 100) + '%', label: x.kind === 'momentum' ? '' : x.m + "'",
      isGoal: x.kind === 'goal', isCard: x.kind === 'card', isMomentum: x.kind === 'momentum',
      color: x.team === 'kba' ? 'var(--itg-kba,#2F6BFF)' : 'var(--itg-ngr,#FFB400)',
      seek: () => p.onSeek && p.onSeek(x.m),
    }));
    const on = 'var(--itg-fg,#F4F2EE)', off = 'transparent';
    return {
      playing: p.playing ?? true, paused: !(p.playing ?? true),
      onToggle: () => p.onToggle && p.onToggle(),
      set1: () => p.onSpeed && p.onSpeed(1), set10: () => p.onSpeed && p.onSpeed(10),
      bg1: speed === 1 ? on : off, fg1: speed === 1 ? 'var(--itg-bg,#0C0E0D)' : 'var(--itg-fg-2,#B8B4AD)',
      bg10: speed === 10 ? on : off, fg10: speed === 10 ? 'var(--itg-bg,#0C0E0D)' : 'var(--itg-fg-2,#B8B4AD)',
      keyMoment: !!p.keyMoment,
      markers, progress: Math.min(100, minute / 90 * 100) + '%',
      minuteLabel: p.minuteLabel ?? (minute + "'"),
    };
  }
}
</script>
</body>
</html>
