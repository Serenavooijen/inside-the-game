<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modern-design-system-7e240850-8421-4e94-8aa0-19cdc16d01ba/colors_and_type.css">
<script src="_ds/modern-design-system-7e240850-8421-4e94-8aa0-19cdc16d01ba/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>@keyframes itgLive{0%,100%{opacity:1}50%{opacity:.35}}</style>
</helmet>
<div style="height:104px; box-sizing:border-box; padding:0 40px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:32px; border-bottom:1px solid var(--itg-line,#2A2E2B); background:var(--itg-bg,#0C0E0D); color:var(--itg-fg,#F4F2EE); font-family:'Geist',sans-serif; font-variant-numeric:tabular-nums;">
  <div style="display:flex; align-items:center; gap:20px; min-width:0;">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="1" y="1" width="28" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M15 1v28" stroke="currentColor" stroke-width="1.5"></path><circle cx="15" cy="15" r="5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="22" cy="9" r="3" fill="var(--itg-accent,#D4FF3F)"></circle></svg>
      <div style="font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:28px; letter-spacing:.04em; text-transform:uppercase; line-height:1;">Inside the Game</div>
    </div>
    <sc-if value="{{ isLive }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:9999px; background:var(--itg-surface-2,#1F2320); font-size:14px; font-weight:600;">
        {{ liveDot }}
        <div>Live</div>
      </div>
    </sc-if>
    <sc-if value="{{ isReplay }}">
      <div style="display:flex; align-items:center; gap:10px; padding:6px 14px 6px 10px; border-radius:9999px; border:1px solid var(--itg-line-strong,#3A3F3B); font-size:14px; font-weight:600; white-space:nowrap; flex:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        <div>Recorded replay</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; color:var(--itg-fg-3,#8A867F);">No live AI</div>
      </div>
    </sc-if>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="display:flex; align-items:stretch; height:60px; border-radius:10px; overflow:hidden; background:var(--itg-surface-2,#1F2320); box-shadow:0 4px 12px rgba(0,0,0,.25);">
      <div style="display:flex; align-items:center; gap:12px; padding:0 18px 0 14px; border-bottom:5px solid var(--itg-kba,#2F6BFF);">
        <svg width="32" height="36" viewBox="0 0 34 38"><path d="M17 1 32 6v12c0 10-7 16-15 19C9 34 2 28 2 18V6Z" fill="#2F6BFF" stroke="#fff" stroke-width="2"></path><path d="M7 25q10-13 20 0" fill="none" stroke="#fff" stroke-width="2.5"></path><path d="M7 25h20M12 25v-5M17 25v-8M22 25v-5" stroke="#fff" stroke-width="1.6"></path></svg>
        <div style="font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:32px; letter-spacing:.04em;">KBA</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; padding:0 22px; background:var(--itg-fg,#F4F2EE); color:var(--itg-bg,#0C0E0D); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:46px; line-height:1;">
        <div>{{ home }}</div>
        <div style="font-size:28px; opacity:.5;">–</div>
        <div>{{ away }}</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:0 14px 0 18px; border-bottom:5px solid var(--itg-ngr,#FFB400);">
        <div style="font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:32px; letter-spacing:.04em;">NGR</div>
        <svg width="34" height="34" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="#FFB400" stroke="#121212" stroke-width="2"></circle><circle cx="18" cy="18" r="11" fill="none" stroke="#121212" stroke-width="1.4"></circle><path d="M18 6l3 12-3-3-3 3Z" fill="#121212"></path><path d="M18 30l-3-12 3 3 3-3Z" fill="none" stroke="#121212" stroke-width="1.2"></path></svg>
      </div>
      <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 18px; border-left:1px solid var(--itg-line,#2A2E2B); min-width:96px;">
        <div style="font-family:'JetBrains Mono',monospace; font-weight:500; font-size:24px; line-height:1;">{{ clock }}</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--itg-fg-3,#8A867F); margin-top:4px;">{{ period }}</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:18px; height:18px; font-size:13px; color:var(--itg-fg-2,#B8B4AD);">
      <sc-for list="{{ events }}" as="e" hint-placeholder-count="2">
        <div style="display:flex; align-items:center; gap:6px;">
          <sc-if value="{{ e.isGoal }}"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#fff" stroke="#121212"></circle><path d="M6 3.5 8.3 5.2 7.4 8H4.6L3.7 5.2Z" fill="#121212"></path></svg></sc-if>
          <sc-if value="{{ e.isYellow }}"><div style="width:8px; height:11px; border-radius:2px; background:#FFD21F;"></div></sc-if>
          <sc-if value="{{ e.isSub }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M8 3v14m-4-4 4 4 4-4" stroke="var(--itg-ok,#3DD68C)"></path><path d="M16 21V7m4 4-4-4-4 4" stroke="var(--itg-bad,#FF5A4F)"></path></svg></sc-if>
          <div style="width:6px; height:6px; border-radius:2px; background:{{ e.color }};"></div>
          <div>{{ e.text }}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex; justify-content:flex-end; align-items:center; gap:40px;">
    <div style="display:flex; flex-direction:column; gap:6px; width:200px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; line-height:1;">{{ possH }}%</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--itg-fg-3,#8A867F);">POSSESSION</div>
        <div style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; line-height:1;">{{ possA }}%</div>
      </div>
      <div style="display:flex; gap:3px; height:6px;">
        <div style="flex:{{ possH }}; background:var(--itg-kba,#2F6BFF); border-radius:9999px;"></div>
        <div style="flex:{{ possA }}; background:var(--itg-ngr,#FFB400); border-radius:9999px;"></div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
      <div style="display:flex; gap:14px; align-items:baseline; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; line-height:1;">
        <div>{{ xgH }}</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.12em; color:var(--itg-fg-3,#8A867F);">XG</div>
        <div>{{ xgA }}</div>
      </div>
      <div style="display:flex; gap:3px; height:6px; width:120px;">
        <div style="flex:{{ xgHf }}; background:var(--itg-kba,#2F6BFF); border-radius:9999px;"></div>
        <div style="flex:{{ xgAf }}; background:var(--itg-ngr,#FFB400); border-radius:9999px;"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:104},&quot;home&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;away&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;clock&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;57:40&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;period&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2ND HALF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;replay&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;xg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;poss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;events&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{kind,team,text}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const xg = p.xg || ['1.64', '0.88'];
    const poss = p.poss || [59, 41];
    const events = (p.events || [{ kind: 'goal', team: 'kba', text: "Varga 23'" }, { kind: 'goal', team: 'ngr', text: "Bakker 38'" }]).map(e => ({
      ...e, isGoal: e.kind === 'goal', isYellow: e.kind === 'yellow', isSub: e.kind === 'sub',
      color: e.team === 'kba' ? 'var(--itg-kba,#2F6BFF)' : 'var(--itg-ngr,#FFB400)',
    }));
    return {
      isLive: (p.mode ?? 'live') === 'live', isReplay: p.mode === 'replay',
      liveDot: React.createElement('span', { style: { width: 9, height: 9, borderRadius: 9999, background: 'var(--itg-bad,#FF5A4F)', display: 'inline-block', animation: 'itgLive 1.6s ease-in-out infinite' } }),
      home: p.home ?? 1, away: p.away ?? 1, clock: p.clock ?? '57:40', period: p.period ?? '2ND HALF',
      events, possH: poss[0], possA: poss[1], xgH: xg[0], xgA: xg[1], xgHf: parseFloat(xg[0]), xgAf: parseFloat(xg[1]),
    };
  }
}
</script>
</body>
</html>
