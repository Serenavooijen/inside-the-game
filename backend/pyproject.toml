[project]
name = "inside-the-game-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-openai>=1.17.0",
    "azure-ai-projects>=2.7.0",
    "azure-identity>=1.26.0",
    "fastapi>=0.156.0",
    "pydantic>=2.14.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
